---
# tasks file for roles/grpc

- name: Install Protobuf compiler (protoc)
  become: true
  apt:
    name:
      - protobuf-compiler
      - libprotobuf-dev
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Install Go gRPC plugins and CLI tools
  shell: |
    /usr/local/go/bin/go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
    /usr/local/go/bin/go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    /usr/local/go/bin/go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
    /usr/local/go/bin/go install github.com/fullstorydev/grpcui/cmd/grpcui@latest
  become: true
  become_user: "{{ real_user.stdout }}"
  environment:
    HOME: "{{ real_user_home.stdout }}"
    GOPATH: "{{ real_user_home.stdout }}/go"
    http_proxy: "{{ proxy | default('') }}"
    https_proxy: "{{ proxy | default('') }}"
  tags: [grpc_go]

- name: Install Rust gRPC tools (protoc-gen-prost & protoc-gen-tonic)
  shell: |
    "{{ real_user_home.stdout }}/.cargo/bin/cargo" install protoc-gen-prost protoc-gen-tonic
  become: true
  become_user: "{{ real_user.stdout }}"
  environment:
    HOME: "{{ real_user_home.stdout }}"
    http_proxy: "{{ proxy | default('') }}"
    https_proxy: "{{ proxy | default('') }}"
  async: 600
  poll: 10
  tags: [grpc_rust]
