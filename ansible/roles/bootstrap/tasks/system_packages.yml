- name: Install packages
  become: true
  apt:
    name:
      # UI
      - fonts-powerline
      - fontconfig
      # Clipboard
      - wl-clipboard
      # Build tools
      - build-essential
      - cmake
      # Development tools
      - git
      - htop
      - wget
      - curl
      - ripgrep
      - libtool-bin
      - unzip
      - fzf

      # Formatter & Parsers
      - clang-format
      - pandoc

    state: present
    update_cache: yes
