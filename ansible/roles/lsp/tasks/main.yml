---
# tasks file for roles/lsp

- name: Install NPM global LSP packages
  ansible.builtin.npm:
    name: "{{ item }}"
    global: yes
    state: present
  loop: "{{ npm_lsp_packages }}"
  become: true
  become_user: "{{ real_user.stdout }}"
  environment:
    HOME: "{{ real_user_home.stdout }}"
    http_proxy: "{{ proxy | default('') }}"
    https_proxy: "{{ proxy | default('') }}"
  when: npm_lsp_packages is defined and npm_lsp_packages | length > 0
