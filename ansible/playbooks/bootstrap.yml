---
- name: Bootstrap Workstation
  hosts: localhost
  become: true
  gather_facts: true

  pre_tasks:
    - name: Detect user shell
      include_role:
        name: shell_detect

  tasks:
    - name: Debug
      debug:
        msg: "playbook_dir: {{ playbook_dir }}, inventory_hostname: {{ inventory_hostname }}"
      tags: [debug]

    - name: Debug
      debug:
        msg: "Proxy is SET to '{{ proxy }}'"
      when: (proxy | default('')) | trim != ""
      tags: [debug]

    - name: Debug
      debug:
        msg: "Proxy is not SET"
      when: (proxy | default('')) | trim == ""
      tags: [debug]

  roles:
    - bootstrap
    - docker
    - golang
    - rust
    - python
    - java
    - neovim
    - lsp


